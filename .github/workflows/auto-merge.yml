name: Auto Merge Agent PRs

on:
  pull_request:
    types: [labeled, synchronize]
  check_suite:
    types: [completed]
  status:

jobs:
  auto-merge:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'automerge-ready')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for all checks
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          echo "Waiting for all checks to complete on PR #$PR_NUM..."

          TIMEOUT=600
          ELAPSED=0
          INTERVAL=10

          while [ $ELAPSED -lt $TIMEOUT ]; do
            # Get all check runs for this PR
            CHECKS=$(gh api repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/check-runs --paginate 2>/dev/null || echo '{"check_runs":[]}')

            # Count total and completed checks
            TOTAL=$(echo "$CHECKS" | jq '.check_runs | length')
            COMPLETED=$(echo "$CHECKS" | jq '[.check_runs[] | select(.conclusion != null)] | length')

            echo "Checks: $COMPLETED/$TOTAL completed"

            if [ "$COMPLETED" -ge 1 ] && [ "$COMPLETED" -eq "$TOTAL" ]; then
              echo "All checks completed!"
              break
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "TIMEOUT: Checks did not complete within $TIMEOUT seconds"
            exit 1
          fi

      - name: Verify all checks passed
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          SHA=${{ github.event.pull_request.head.sha }}

          CHECKS=$(gh api repos/${{ github.repository }}/commits/$SHA/check-runs --paginate 2>/dev/null || echo '{"check_runs":[]}')

          FAILED=$(echo "$CHECKS" | jq '[.check_runs[] | select(.conclusion == "failure")] | length')
          CANCELLED=$(echo "$CHECKS" | jq '[.check_runs[] | select(.conclusion == "cancelled")] | length')

          if [ "$FAILED" -gt 0 ] || [ "$CANCELLED" -gt 0 ]; then
            echo "Some checks failed: $FAILED failures, $CANCELLED cancellations"
            echo "NOT auto-merging PR"
            exit 1
          fi

          SUCCESS=$(echo "$CHECKS" | jq '[.check_runs[] | select(.conclusion == "success")] | length')
          TOTAL=$(echo "$CHECKS" | jq '.check_runs | length')

          echo "All $TOTAL checks passed (success: $SUCCESS)"

      - name: Check if merge conflict
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          MERGEABLE=$(gh api repos/${{ github.repository }}/pulls/$PR_NUM --jq '.mergeable' 2>/dev/null || echo "unknown")

          if [ "$MERGEABLE" = "false" ]; then
            echo "PR has merge conflicts - NOT auto-merging"
            exit 1
          fi

          echo "No merge conflicts detected"

      - name: Auto Merge PR
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          TARGET_BRANCH=${{ github.event.pull_request.base.ref }}

          echo "All rigorous checks passed! Auto-merging PR #$PR_NUM to $TARGET_BRANCH..."
          gh pr merge $PR_NUM --squash --delete-branch

          echo "SUCCESS: PR #$PR_NUM merged to $TARGET_BRANCH"