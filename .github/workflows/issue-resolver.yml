name: Issue Resolver

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  push:
    branches:
      - 'issue-*'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  resolve-issue:
    if: "github.event_name == 'push' || contains(github.event.issue.body, '/fix') || contains(github.event.comment.body, '/fix')"
    runs-on: ubuntu-latest
    outputs:
      issue_num: ${{ steps.issue_info.outputs.ISSUE_NUM }}
      branch_name: ${{ steps.branch_setup.outputs.BRANCH_NAME }}
      build_success: ${{ steps.send_to_opencode.outputs.BUILD_SUCCESS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine Issue Number
        id: issue_info
        run: |
          echo "Determining issue context..."

          if [ "${{ github.event_name }}" == "push" ]; then
            CURRENT_BRANCH=$(git branch --show-current)
            ISSUE_NUM=$(echo "$CURRENT_BRANCH" | grep -oE '[0-9]+' || echo "0")
            echo "Triggered by push to $CURRENT_BRANCH, extracted issue #$ISSUE_NUM"
            echo "ISSUE_NUM=$ISSUE_NUM" >> $GITHUB_OUTPUT

            if [ -f .github/issue-context ]; then
              echo "Loading previous issue context..."
              cp .github/issue-context .issue_body_tmp
            else
              printf '' > .issue_body_tmp
            fi

            if [ -f .build_error.txt ]; then
              echo "Including build error from previous iteration..."
              printf '\n[BUILD ERROR FROM PREVIOUS ITERATION]\n' >> .issue_body_tmp
              head -30 .build_error.txt >> .issue_body_tmp
            fi

            printf '' > .comment_body_tmp
          elif [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "Triggered by issue comment"
            echo "ISSUE_NUM=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            printf '%s' "${{ github.event.issue.body }}" | base64 > .issue_body_tmp
            printf '%s' "${{ github.event.comment.body }}" | base64 > .comment_body_tmp
          elif [ "${{ github.event_name }}" == "issues" ]; then
            echo "Triggered by issue"
            echo "ISSUE_NUM=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            printf '%s' "${{ github.event.issue.body }}" | base64 > .issue_body_tmp
            printf '' > .comment_body_tmp
          fi

      - name: Setup Issue Branch
        id: branch_setup
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ISSUE_NUM: ${{ steps.issue_info.outputs.ISSUE_NUM }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          ISSUE_NUM=${{ steps.issue_info.outputs.ISSUE_NUM }}
          BRANCH_NAME="issue-${ISSUE_NUM}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_OUTPUT

          echo "Setting up branch: $BRANCH_NAME"

          CURRENT_BRANCH=$(git branch --show-current)

          if [ "$CURRENT_BRANCH" = "$BRANCH_NAME" ]; then
            echo "Already on branch $BRANCH_NAME, pulling latest..."
            git pull origin $BRANCH_NAME --rebase || true
          elif git ls-remote --heads origin $BRANCH_NAME 2>/dev/null | grep -q "$BRANCH_NAME"; then
            echo "Branch exists, checking out..."
            git fetch origin $BRANCH_NAME
            git checkout $BRANCH_NAME
            git pull origin $BRANCH_NAME --rebase || true
          else
            echo "Creating new branch: $BRANCH_NAME from devops"
            git checkout -b $BRANCH_NAME origin/devops
            mkdir -p .github
            echo "$ISSUE_NUM" > .github/issue-number
            ISSUE_BODY_STR="${{ steps.issue_info.outputs.ISSUE_BODY }}"
            if [ -n "$ISSUE_BODY_STR" ]; then
              echo "$ISSUE_BODY_STR" > .github/issue-context
            fi
            git add .github/issue-number .github/issue-context 2>/dev/null || git add .github/issue-number
            git commit -m "chore: initialized issue branch for #${ISSUE_NUM}"
            git push -u origin $BRANCH_NAME
          fi

      - name: Send to OpenCode for Fix
        id: send_to_opencode
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          ISSUE_NUM: ${{ steps.issue_info.outputs.ISSUE_NUM }}
        run: |
          echo "Analyzing issue for autonomous fix..."

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p .git/info
          echo ".build_error.txt" >> .git/info/exclude
          echo ".issue_body_tmp" >> .git/info/exclude
          echo ".comment_body_tmp" >> .git/info/exclude

          set +e
          CARGO_OUTPUT=$(cargo check 2>&1)
          CARGO_EXIT=$?
          set -e

          BRANCH_NAME=$(git branch --show-current)
          ISSUE_NUM=${{ steps.issue_info.outputs.ISSUE_NUM }}
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          ISSUE_BODY=$(cat .issue_body_tmp 2>/dev/null | base64 -d || echo "No issue body")
          COMMENT_BODY=$(cat .comment_body_tmp 2>/dev/null | base64 -d || echo "No comment")
          BUILD_ERROR=$(cat .build_error.txt 2>/dev/null || echo "$CARGO_OUTPUT")

          WEBHOOK_URL="https://webhook.akinus21.com/webhook/akclip-build"

          echo "$BUILD_ERROR" > /tmp/error.log

          python3 -c "$(echo '' | base64 -d)"

          PASTY_IDS=$(python3 -c "$(echo '' | base64 -d)" 2>/dev/null || echo "pasty_url=https://pasty.akinus21.com/error"

          PASTY_URL=$(echo "$PASTY_IDS" | grep pasty_url | cut -d= -f2)

          printf -v MESSAGE 'REPO: %s\nBRANCH TO PUSH FIXES: %s\nISSUE #: %s\n\n=== ISSUE BODY ===\n%s\n\n=== COMMENT ===\n%s\n\n=== BUILD ERROR ===\n%s\n\nFull error logs: %s' \
            "$REPO" "$BRANCH_NAME" "$ISSUE_NUM" "$ISSUE_BODY" "$COMMENT_BODY" "$BUILD_ERROR" "$PASTY_URL"

          jq -n \
            --arg event "build_failure" \
            --arg repo "$REPO" \
            --arg run_url "$RUN_URL" \
            --arg sha "$SHA" \
            --arg ref "$BRANCH_NAME" \
            --arg branch "$BRANCH_NAME" \
            --arg issue_num "$ISSUE_NUM" \
            --arg error "$BUILD_ERROR" \
            --arg pasty_url "$PASTY_URL" \
            --arg message "$MESSAGE" \
            '{event:$event,repo:$repo,run_url:$run_url,sha:$sha,ref:$ref,branch:$branch,issue_num:$issue_num,error:$error,pasty_url:$pasty_url,message:$message}' > /tmp/payload.json

          SIG=$(openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_HMAC_SECRET }}" /tmp/payload.json | awk '{print "sha256="$2}')

          RETRY_COUNT=0
          SUCCESS=false

          while [ "$SUCCESS" = "false" ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Sending webhook to OpenCode (attempt $RETRY_COUNT)..."

            if curl -fsSL -X POST \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Event: build_failure" \
              -H "X-Hub-Signature-256: $SIG" \
              --data-binary @/tmp/payload.json \
              "$WEBHOOK_URL"; then
              SUCCESS=true
              echo "Webhook sent successfully, OpenCode will push fixes to $BRANCH_NAME"
            else
              echo "Webhook attempt $RETRY_COUNT failed, retrying in 5 seconds..."
              sleep 5
            fi
          done

          echo "OpenCode notified. Waiting for fixes to be pushed to $BRANCH_NAME..."

  create-pr:
    needs: resolve-issue
    if: needs.resolve-issue.outputs.build_success == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      ISSUE_NUM: ${{ needs.resolve-issue.outputs.issue_num }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Create PR to Devops
        run: |
          BRANCH_NAME=$(git branch --show-current)

          EXISTING_PR=$(gh pr list --head $BRANCH_NAME --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for branch $BRANCH_NAME, skipping creation"
          else
            echo "Build succeeded! Creating PR to devops..."
            PR_BODY=$(printf '%s\n%s\n%s\n' \
              "Closes #${ISSUE_NUM}" \
              "This PR contains the autonomous fix for the reported issue." \
              "The agent has verified that the build passes. Merging to devops will trigger integration to main.")

            gh pr create \
              --base devops \
              --head $BRANCH_NAME \
              --title "Fix issue #${ISSUE_NUM}" \
              --body "${PR_BODY}"
            echo "PR created successfully"
          fi

      - name: Post PR Link to Issue
        run: |
          PR_URL=$(gh pr list --head $BRANCH_NAME --state open --json url --jq '.[0].url' 2>/dev/null || echo "")
          if [ -n "$PR_URL" ]; then
            COMMENT_BODY=$(printf '%s\n%s\n%s\n%s\n' \
              "## Fix In Progress" \
              "Agent has created a PR to address this issue: $PR_URL" \
              "The build has passed and the fix is ready for review." \
              "Merge the PR to devops to trigger integration to main.")
            gh issue comment $ISSUE_NUM --body "${COMMENT_BODY}"
          fi