name: Issue Resolver

on:
  push:
    branches:
      - 'issue-*'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  resolve-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Extract Issue Number
        id: extract_issue
        run: |
          set -e
          BRANCH_NAME=$(git branch --show-current)
          ISSUE_NUM=$(echo "$BRANCH_NAME" | grep -oE '[0-9]+' || echo "0")
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "ISSUE_NUM=$ISSUE_NUM" >> $GITHUB_OUTPUT

      - name: Build and Test
        id: build
        run: |
          set -e
          cargo build --release 2>&1 | tee build.log

      - name: Send Build Failure Webhook
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK_URL: https://webhook.akinus21.com/webhook/akclip-build
          ISSUE_NUM: ${{ steps.extract_issue.outputs.ISSUE_NUM }}
          BRANCH_NAME: ${{ steps.extract_issue.outputs.BRANCH_NAME }}
        run: |
          set -e
          BUILD_ERROR="$(cat build.log 2>/dev/null || echo 'Build failed')"
          MESSAGE="BUILD_FAILURE: Issue #${ISSUE_NUM} | BRANCH: ${BRANCH_NAME} | ERROR: ${BUILD_ERROR} | INSTRUCTIONS: Fix the build error, push to origin/${BRANCH_NAME}, CI will rebuild."
          jq -n \
            --arg event "build_failure" \
            --arg repo "$REPO" \
            --arg run_url "$RUN_URL" \
            --arg sha "$SHA" \
            --arg ref "$BRANCH_NAME" \
            --arg branch "$BRANCH_NAME" \
            --arg issue_num "$ISSUE_NUM" \
            --arg error "$BUILD_ERROR" \
            --arg message "$MESSAGE" \
            '{event:$event,repo:$repo,run_url:$run_url,sha:$sha,ref:$ref,branch:$branch,issue_num:$issue_num,error:$error,message:$message}' > /tmp/payload.json
          SIG=$(openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_HMAC_SECRET }}" /tmp/payload.json | awk '{print "sha256="$2}')
          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: build_failure" \
            -H "X-Hub-Signature-256: $SIG" \
            --data-binary @/tmp/payload.json \
            "$WEBHOOK_URL"

      - name: Comment Build Failure on Issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ISSUE_NUM: ${{ steps.extract_issue.outputs.ISSUE_NUM }}
        run: |
          set -e
          gh issue comment $ISSUE_NUM --body "Build failed. Agent has been notified and will push a fix."

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: akclip-binary
          path: target/release/akclip

      - name: Create PR to Devops
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ISSUE_NUM: ${{ steps.extract_issue.outputs.ISSUE_NUM }}
          BRANCH_NAME: ${{ steps.extract_issue.outputs.BRANCH_NAME }}
        run: |
          set -e
          echo "Build succeeded! Creating PR to devops..."
          EXISTING_PR=$(gh pr list --head $BRANCH_NAME --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for branch $BRANCH_NAME"
          else
            gh pr create \
              --base devops \
              --head $BRANCH_NAME \
              --title "Fix issue #$ISSUE_NUM" \
              --body "Closes #$ISSUE_NUM

This PR contains the autonomous fix for the reported issue.
The agent has verified that the build passes. Merging to devops will trigger integration to main."
            echo "PR created successfully"
          fi

      - name: Post PR Link to Issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ISSUE_NUM: ${{ steps.extract_issue.outputs.ISSUE_NUM }}
          BRANCH_NAME: ${{ steps.extract_issue.outputs.BRANCH_NAME }}
        run: |
          set -e
          PR_URL=$(gh pr list --head $BRANCH_NAME --state open --json url --jq '.[0].url' 2>/dev/null || echo "")
          if [ -n "$PR_URL" ]; then
            gh issue comment $ISSUE_NUM --body "## Fix Applied Successfully

Agent has created a PR to address this issue: $PR_URL
The build has passed and the fix is ready for review.
Merge the PR to devops to trigger integration to main."
          fi