name: Issue Resolver

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  push:
    branches:
      - 'issue-*'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  resolve-issue:
    if: "!contains(github.event.comment.body, '/close')"
    runs-on: ubuntu-latest
    outputs:
      issue_num: ${{ steps.issue_info.outputs.ISSUE_NUM }}
      pr_num: ${{ steps.issue_info.outputs.PR_NUM }}
      branch_name: ${{ steps.branch_setup.outputs.BRANCH_NAME }}
      build_success: ${{ steps.build_verify.outputs.BUILD_SUCCESS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine Issue Number
        id: issue_info
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_BODY: ${{ github.event.pull_request.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Determining issue context..."

          if [ "${{ github.event_name }}" == "push" ]; then
            # Extract issue number from branch name (issue-55 -> 55)
            CURRENT_BRANCH=$(git branch --show-current)
            ISSUE_NUM=$(echo "$CURRENT_BRANCH" | grep -oE '[0-9]+' || echo "0")
            echo "Triggered by push to $CURRENT_BRANCH, extracted issue #$ISSUE_NUM"
            echo "ISSUE_NUM=$ISSUE_NUM" >> $GITHUB_OUTPUT

            # Load previous issue context from .github/issue-context if exists
            if [ -f .github/issue-context ]; then
              echo "Loading previous issue context..."
              ISSUE_BODY=$(cat .github/issue-context)
            else
              ISSUE_BODY=""
            fi

            # Include build error from previous iteration
            if [ -f .build_error.txt ]; then
              echo "Including build error from previous iteration..."
              ISSUE_BODY="${ISSUE_BODY}

[BUILD ERROR FROM PREVIOUS ITERATION]:
$(cat .build_error.txt)"
            fi

            echo "ISSUE_BODY<<EOF" >> $GITHUB_OUTPUT
            echo "$ISSUE_BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "COMMENT_BODY=" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "Triggered by issue comment"
            echo "ISSUE_NUM=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "ISSUE_BODY<<EOF" >> $GITHUB_OUTPUT
            echo "$ISSUE_BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "COMMENT_BODY<<EOF" >> $GITHUB_OUTPUT
            echo "$COMMENT_BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "issues" ]; then
            echo "Triggered by issue"
            echo "ISSUE_NUM=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "ISSUE_BODY<<EOF" >> $GITHUB_OUTPUT
            echo "$ISSUE_BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "COMMENT_BODY=" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "pull_request_review_comment" ]; then
            echo "Triggered by PR comment"
            ISSUE_NUM=$(echo "$PR_BODY" | grep -oE 'Closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || echo "")
            if [ -z "$ISSUE_NUM" ]; then
              echo "No issue number found in PR body"
              ISSUE_NUM="0"
            fi
            echo "ISSUE_NUM=$ISSUE_NUM" >> $GITHUB_OUTPUT
            echo "PR_NUM=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "COMMENT_BODY<<EOF" >> $GITHUB_OUTPUT
            echo "$COMMENT_BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Setup Issue Branch
        id: branch_setup
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ISSUE_NUM: ${{ steps.issue_info.outputs.ISSUE_NUM }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          ISSUE_NUM=${{ steps.issue_info.outputs.ISSUE_NUM }}
          BRANCH_NAME="issue-${ISSUE_NUM}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_OUTPUT

          echo "Setting up branch: $BRANCH_NAME"

          CURRENT_BRANCH=$(git branch --show-current)

          # If we're already on the correct issue branch (from push trigger), skip creation
          if [ "$CURRENT_BRANCH" = "$BRANCH_NAME" ]; then
            echo "Already on branch $BRANCH_NAME, pulling latest..."
            git pull origin $BRANCH_NAME --rebase || true
          elif git ls-remote --heads origin $BRANCH_NAME 2>/dev/null | grep -q "$BRANCH_NAME"; then
            echo "Branch exists, checking out..."
            git fetch origin $BRANCH_NAME
            git checkout $BRANCH_NAME
            git pull origin $BRANCH_NAME --rebase || true
          else
            echo "Creating new branch: $BRANCH_NAME from devops"
            git checkout -b $BRANCH_NAME origin/devops
            mkdir -p .github
            echo "$ISSUE_NUM" > .github/issue-number
            # Save issue context for future iterations
            ISSUE_BODY_STR="${{ steps.issue_info.outputs.ISSUE_BODY }}"
            if [ -n "$ISSUE_BODY_STR" ]; then
              echo "$ISSUE_BODY_STR" > .github/issue-context
            fi
            git add .github/issue-number .github/issue-context 2>/dev/null || git add .github/issue-number
            git commit -m "chore: initialized issue branch for #${ISSUE_NUM}"
            git push -u origin $BRANCH_NAME
          fi

      - name: Analyze and Fix Issue
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          ISSUE_NUM: ${{ steps.issue_info.outputs.ISSUE_NUM }}
          PR_NUM: ${{ steps.issue_info.outputs.PR_NUM }}
          ISSUE_BODY: ${{ steps.issue_info.outputs.ISSUE_BODY }}
          COMMENT_BODY: ${{ steps.issue_info.outputs.COMMENT_BODY }}
        run: |
          echo "Analyzing issue for autonomous fix..."

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git pull origin $(git branch --show-current) --rebase || true

          LOOP_COUNT=$(git log -n 100 --format="%s" | grep -c "autonomously patched" || true)
          echo "Current autonomous remediation loop depth: $LOOP_COUNT"
          if [ "$LOOP_COUNT" -ge 10 ]; then
            echo "CRITICAL: Maximum iteration depth reached (10 attempts)."
            echo "Posting failure comment to existing issue..."
            LOOP_HISTORY=$(git log -n 10 --oneline)
            COMMENT_BODY=$(printf '%s\n%s\n%s\n\n%s\n' \
              "## Automated Fix Failed" \
              "The autonomous agent attempted 10 iterations to fix this issue but was unsuccessful. Manual intervention is required." \
              "Loop history:" \
              "${LOOP_HISTORY}")
            gh issue comment $ISSUE_NUM --body "${COMMENT_BODY}"
            echo "::error::Issue resolver failed after 10 iterations"
            exit 1
          fi

          mkdir -p .git/info
          echo "payload.json" >> .git/info/exclude
          echo "response.txt" >> .git/info/exclude
          echo "fix.js" >> .git/info/exclude
          echo "VALIDATION_FAILED" >> .git/info/exclude
          echo ".build_error.txt" >> .git/info/exclude

          cat > fix.js << 'ENDSCRIPT'
          const fs = require("fs");
          const issueBody = process.env.ISSUE_BODY || "";
          const commentBody = process.env.COMMENT_BODY || "";
          const mainRs = fs.readFileSync("src/main.rs", "utf8");
          let agentsMd = "";
          let cargoToml = "";
          let readmeMd = "";
          let cicdWorkflow = "";
          let issueWorkflow = "";
          let releaseWorkflow = "";
          let cleanupWorkflow = "";

          try { agentsMd = fs.readFileSync(".github/agents/devops-sre.md", "utf8"); } catch (e) {}
          try { cargoToml = fs.readFileSync("Cargo.toml", "utf8"); } catch (e) {}
          try { readmeMd = fs.readFileSync("README.md", "utf8"); } catch (e) {}
          try { cicdWorkflow = fs.readFileSync(".github/workflows/cicd-devops-loop.yml", "utf8"); } catch (e) {}
          try { issueWorkflow = fs.readFileSync(".github/workflows/issue-resolver.yml", "utf8"); } catch (e) {}
          try { releaseWorkflow = fs.readFileSync(".github/workflows/release-sync.yml", "utf8"); } catch (e) {}
          try { cleanupWorkflow = fs.readFileSync(".github/workflows/issue-cleanup.yml", "utf8"); } catch (e) {}

          const userMessage = "[ISSUE DESCRIPTION]:\n" + issueBody + "\n\n[COMMENT FROM USER]:\n" + commentBody + "\n\nThe user has reported an issue with akclip. Please diagnose and fix it using the project context provided above.";

          const systemPrompt = "You are an expert Rust engineer and DevOps engineer. Your role is to diagnose and fix issues autonomously.\n\n" +
            "## PROJECT CONTEXT\n\n" +
            "This is akclip - a Rust CLI tool that captures stdin to clipboard. It uses arboard for clipboard access.\n\n" +
            "## PROJECT FILES\n\n" +
            "[Cargo.toml]:\n" + cargoToml + "\n\n" +
            "[src/main.rs]:\n" + mainRs + "\n\n" +
            "[README.md]:\n" + readmeMd + "\n\n" +
            "## WORKFLOW FILES\n\n" +
            "[cicd-devops-loop.yml]:\n" + cicdWorkflow + "\n\n" +
            "[issue-resolver.yml]:\n" + issueWorkflow + "\n\n" +
            "[release-sync.yml]:\n" + releaseWorkflow + "\n\n" +
            "[issue-cleanup.yml]:\n" + cleanupWorkflow + "\n\n" +
            "## AGENTS.md (Agent Guidelines):\n" + agentsMd + "\n\n" +
            "## YOUR TASK

            1. DIAGNOSE the issue based on user's description and build errors
            2. FIX the appropriate file(s):
               - Rust compilation/runtime errors -> fix src/main.rs
               - CI/CD, GitHub Actions, Homebrew, releases, checksums -> fix relevant workflow file
               - Logic errors -> fix src/main.rs

            ## CRITICAL INSTRUCTIONS

            Your ENTIRE response must be ONLY valid code for the file that needs fixing.
            - NO explanations, NO analysis, NO markdown, NO backticks, NO text whatsoever
            - For Rust: start with 'use ' or 'fn ' - the very first characters
            - For YAML: start with 'name:' - the very first characters
            - If you output anything except pure code starting with these exact patterns, the fix will FAIL

            FAILURE CONSEQUENCE: If you include any explanatory text, the workflow will detect this as invalid and trigger ANOTHER iteration. This wastes resources. ONLY output raw code.

            The user is counting on you to output ONLY code that can be compiled/applied immediately.

          const payload = {
            model: "minimax-m2.7:cloud",
            stream: false,
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: userMessage }
            ]
          };
          fs.writeFileSync("payload.json", JSON.stringify(payload));
          ENDSCRIPT

          node fix.js

          echo "Sending issue to AI for diagnosis and fix..."

          MAX_RETRIES=10
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = "false" ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "AI request attempt $RETRY_COUNT of $MAX_RETRIES..."

            CurlResponse=$(curl -s -L --post301 --post302 --post303 "https://ollama.akinus21.com/v1/chat/completions" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ollama" \
              -H "User-Agent: GitHubActions-CI" \
              -d @payload.json \
              -w "\n%{http_code}" \
              --connect-timeout 60 \
              --max-time 300)

            HTTP_CODE=$(echo "$CurlResponse" | tail -n1)
            CurlResponse=$(echo "$CurlResponse" | sed '$d')

            if [ "$HTTP_CODE" = "200" ] && echo "$CurlResponse" | head -c1 | grep -q '{'; then
              SUCCESS=true
              echo "AI request successful on attempt $RETRY_COUNT"
            else
              echo "Attempt $RETRY_COUNT failed with HTTP $HTTP_CODE"
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Retrying in 5 seconds..."
                sleep 5
              fi
            fi
          done

          if [ "$SUCCESS" = "false" ]; then
            echo "Primary AI (minimax-m2.7:cloud) failed after $MAX_RETRIES attempts, trying fallback..."
            sed -i 's/"model": "minimax-m2.7:cloud"/"model": "minimax-m2.7"/' payload.json
            CurlResponse=$(curl -s -L --post301 --post302 --post303 "https://ollama.akinus21.com/v1/chat/completions" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ollama" \
              -H "User-Agent: GitHubActions-CI" \
              -d @payload.json \
              -w "\n%{http_code}" \
              --connect-timeout 60 \
              --max-time 300)
            HTTP_CODE=$(echo "$CurlResponse" | tail -n1)
            CurlResponse=$(echo "$CurlResponse" | sed '$d')
            if [ "$HTTP_CODE" != "200" ] || ! echo "$CurlResponse" | head -c1 | grep -q '{'; then
              echo "Fallback AI also failed. Both primary and fallback are unavailable."
              exit 1
            fi
          fi

          echo "$CurlResponse" > response.txt

          cat > parse.js << 'ENDPARSE'
          const fs = require("fs");
          try {
            const rawInput = fs.readFileSync("response.txt", "utf8").trim();
            let combinedContent = "";

            if (rawInput.startsWith("data:")) {
              const lines = rawInput.split("\n");
              for (let line of lines) {
                line = line.trim();
                if (!line || line === "data: [DONE]") continue;
                if (line.startsWith("data:")) {
                  try {
                    const parsedChunk = JSON.parse(line.replace(/^data:\s*/, ""));
                    if (parsedChunk.choices && parsedChunk.choices[0] && parsedChunk.choices[0].delta) {
                      const delta = parsedChunk.choices[0].delta.content || "";
                      combinedContent += delta;
                    }
                  } catch (err) {}
                }
              }
            } else {
              const data = JSON.parse(rawInput);
              if (data.choices && data.choices[0] && data.choices[0].message) {
                combinedContent = data.choices[0].message.content || "";
              } else if (data.error) {
                console.error("AI returned error:", data.error);
                process.exit(1);
              }
            }

            if (!combinedContent) {
              console.error("Empty content stream received.");
              process.exit(1);
            }

            let cleaned = combinedContent.trim();

            // VALIDATION: Ensure response is valid code, not explanation text
            const firstLine = cleaned.split('\n')[0].trim();

            // Acceptable starting patterns for various file types
            const validStartPatterns = [
              'use ', 'fn ', 'struct ', 'impl ', 'enum ', 'mod ', 'pub ', 'const ', 'let ', 'static ', 'trait ', 'type ',  // Rust
              'name:', 'on:', 'jobs:', 'steps:', 'env:', 'run:', 'uses:', 'if:', 'with:', 'permissions:',  // YAML/workflow
              '<', '<?',  // XML/HTML
              '{', '['   // JSON
            ];
            const isLikelyCode = validStartPatterns.some(p => firstLine.startsWith(p));

            // Check if response contains explanation indicators
            const explanationIndicators = ['Looking at', 'The issue', 'The problem', 'I think', 'I need to', 'Here is', 'This is', 'The code', 'error:', 'Error:'];
            const hasExplanation = explanationIndicators.some(e => firstLine.startsWith(e));

            if (!isLikelyCode || hasExplanation) {
              console.error("INVALID RESPONSE: AI returned explanatory text instead of code");
              console.error("First line:", firstLine.substring(0, 100));
              console.error("Writing sentinel to trigger retry...");
              fs.writeFileSync("VALIDATION_FAILED", "true");
              process.exit(0);
            }

            if (cleaned.startsWith("```")) {
              cleaned = cleaned.replace(/^```[a-zA-Z]*\n?/, "");
              cleaned = cleaned.replace(/```$/, "");
            }

            // STRICT detection: must start with expected patterns
            if (firstLine.startsWith('name:') && cleaned.includes("on:") && cleaned.includes("jobs:")) {
              console.log("DETECTED: Workflow file needs fixing");
              fs.writeFileSync(".github/workflows/cicd-devops-loop.yml", cleaned);
              fs.writeFileSync("detected_file.txt", "workflow");
            } else if (firstLine.startsWith('use ') || firstLine.startsWith('fn ') || firstLine.startsWith('struct ') || firstLine.startsWith('impl ') || firstLine.startsWith('const ') || firstLine.startsWith('let ') || firstLine.startsWith('pub ') || firstLine.startsWith('mod ') || firstLine.startsWith('static ') || firstLine.startsWith('enum ') || firstLine.startsWith('trait ') || firstLine.startsWith('type ')) {
              console.log("DETECTED: Rust source file needs fixing");
              fs.writeFileSync("src/main.rs", cleaned);
              fs.writeFileSync("detected_file.txt", "rust");
            } else {
              console.error("INVALID RESPONSE: Cannot determine file type from response");
              console.error("First line:", firstLine.substring(0, 100));
              console.error("Writing sentinel to trigger retry...");
              fs.writeFileSync("VALIDATION_FAILED", "true");
              process.exit(0);
            }
          } catch (e) {
            console.error("Failed processing response:", e.message);
            process.exit(1);
          }
          ENDPARSE

          node parse.js

          DETECTED_FILE=$(cat detected_file.txt)

          if [ -f VALIDATION_FAILED ]; then
            echo "Validation failed in previous run, pushing to trigger retry..."
            rm -f VALIDATION_FAILED
            git add -A
            git commit --allow-empty -m "fix(issue#$ISSUE_NUM): retry due to invalid AI response"
            git push origin $(git branch --show-current)
            echo "NO_CHANGES=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git diff --quiet; then
            echo "No changes needed. AI determined code is correct."
            echo "NO_CHANGES=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "NO_CHANGES=false" >> $GITHUB_OUTPUT
          git add -A

          if [ "$DETECTED_FILE" = "rust" ]; then
            echo "Verifying Rust fix compiles..."
            if cargo check 2>&1; then
              echo "Build verified!"
              git commit -m "fix(issue#$ISSUE_NUM): autonomously patched"
            else
              echo "Build failed but pushing to trigger devops loop..."
              git commit -m "fix(issue#$ISSUE_NUM): autonomously patched (build may need iteration)"
            fi
          else
            echo "Workflow fix detected."
            git commit -m "fix(issue#$ISSUE_NUM): autonomously patched workflow"
          fi

          CURRENT_BRANCH=$(git branch --show-current)
          git push origin $CURRENT_BRANCH

      - name: Build Verification
        id: build_verify
        run: |
          echo "Running build to verify..."
          BRANCH_NAME=$(git branch --show-current)
          echo "Current branch: $BRANCH_NAME"

          BUILD_OUTPUT=$(cargo check 2>&1)
          BUILD_EXIT=$?

          if [ $BUILD_EXIT -eq 0 ]; then
            echo "Build check passed on $BRANCH_NAME!"
            echo "BUILD_SUCCESS=true" >> $GITHUB_OUTPUT
            rm -f .build_error.txt
          else
            echo "Build check failed. Saving error and pushing to trigger iteration..."
            echo "$BUILD_OUTPUT" > .build_error.txt
            echo "$BUILD_OUTPUT"
            echo "BUILD_SUCCESS=false" >> $GITHUB_OUTPUT
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .build_error.txt
            git commit --allow-empty -m "fix(issue#$ISSUE_NUM): build failed, retrying in issue-$ISSUE_NUM branch"
            git push origin $BRANCH_NAME
          fi

  create-pr:
    needs: resolve-issue
    if: needs.resolve-issue.outputs.build_success == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      ISSUE_NUM: ${{ needs.resolve-issue.outputs.issue_num }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Create PR to Devops
        run: |
          BRANCH_NAME=$(git branch --show-current)

          echo "Build succeeded! Creating PR to devops..."

          PR_BODY=$(printf '%s\n%s\n%s\n' \
            "Closes #${ISSUE_NUM}" \
            "This PR contains the autonomous fix for the reported issue." \
            "The agent has verified that the build passes. Merging to devops will trigger integration to main.")

          gh pr create \
            --base devops \
            --head $BRANCH_NAME \
            --title "Fix issue #${ISSUE_NUM}" \
            --body "${PR_BODY}"

      - name: Post PR Link to Issue
        run: |
          PR_URL=$(gh pr list --head $BRANCH_NAME --state open --json url --jq '.[0].url' 2>/dev/null || echo "")
          if [ -n "$PR_URL" ]; then
            COMMENT_BODY=$(printf '%s\n%s\n%s\n%s\n' \
              "## Fix In Progress" \
              "Agent has created a PR to address this issue: $PR_URL" \
              "The build has passed and the fix is ready for review." \
              "Merge the PR to devops to trigger integration to main.")
            gh issue comment $ISSUE_NUM --body "${COMMENT_BODY}"
          fi

  respond-to-comment:
    needs: resolve-issue
    if: github.event_name == 'pull_request_review_comment'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      PR_NUM: ${{ needs.resolve-issue.outputs.pr_num }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Respond to PR Comment
        run: |
          echo "Responding to PR comment..."

          BRANCH_NAME=$(git branch --show-current)

          gh pr comment $PR_NUM --body "Agent acknowledged your request on branch ${BRANCH_NAME}. Work is being processed."
