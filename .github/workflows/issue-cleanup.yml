name: Issue Cleanup

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  cleanup-issue:
    if: contains(github.event.comment.body, '/close')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Cleanup Merged PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "Processing /close command for issue #$ISSUE_NUMBER..."

          # Find the branch for this issue
          BRANCH_NAME="issue-${ISSUE_NUMBER}"

          # Check if branch exists
          if git ls-remote --heads origin $BRANCH_NAME 2>/dev/null | grep -q "$BRANCH_NAME"; then
            echo "Found branch $BRANCH_NAME, deleting it..."
            git push origin --delete $BRANCH_NAME 2>/dev/null || echo "Could not delete branch"
          else
            echo "No branch found for issue #$ISSUE_NUMBER"
          fi

          # Comment on the issue
          gh issue comment $ISSUE_NUMBER --body "Issue #$ISSUE_NUMBER is being closed. Branch $BRANCH_NAME has been cleaned up."

          # Close the issue
          gh issue close $ISSUE_NUMBER --comment "Closed by agent via /close command."
