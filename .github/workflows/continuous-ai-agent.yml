name: Agentic DevOps Loop
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["Build and Test"] # Listens to your primary build pipeline
    types: [completed]

jobs:
  agent-loop:
    # Run only on failed builds or when explicitly commanded via issue comments
    if: >
      (github.event.workflow_run.conclusion == 'failure') || 
      (github.event.issue && contains(github.event.comment.body, '/fix'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Run Autonomous Agent
        # FIXED: Points to the pre-compiled runtime package to stop Docker compilation failures
        uses: github/gh-aw-actions/execute@v1 
        env:
          # Points the underlying LLM client to your personal Ollama instance
          OPENAI_API_BASE: "https://akinus21.com"
          OPENAI_API_KEY: "ollama" # Ollama usually accepts any string or none if unauthenticated
        with:
          agent-definition: '.github/agents/devops-sre.md'
          github-token: ${{ secrets.GH_TOKEN }}
