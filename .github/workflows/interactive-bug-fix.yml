name: Interactive Bug Fixer

on:
  issue_comment:
    types: [created]

jobs:
  fix-issue:
    # Only run if someone comments with /fix
    if: contains(github.event.comment.body, '/fix')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Interaction Loop via Custom Backend
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          echo "Connecting to distributed llama.cpp architecture..."
          
          # Safely construct the JSON payload via Node to avoid shell escaping drops
          node -e '
          const fs = require("fs");
          const payload = {
            model: "akai-net",
            stream: false,
            messages: [
              { role: "system", content: "You are an autonomous Rust engineer. Apply fixes based on the prompt, modify files locally, and verify compilation using cargo check." },
              { role: "user", content: process.env.COMMENT_BODY }
            ]
          };
          fs.writeFileSync("interactive_payload.json", JSON.stringify(payload));
          '

          curl -s -X POST "https://ollama.akinus21.com" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ollama" \
            -d @interactive_payload.json
