name: Autonomous DevOps Loop

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Codebase
        id: cargo_build
        run: cargo build --release

  remediate-failure:
    needs: build-and-test
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ask akai-net to Self-Heal and Submit PR
        env:
          OLLAMA_URL: "https://ollama.akinus21.com"
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GitHub CI is gathering context from src/main.rs..."
          
          # Clean, unescaped jq syntax that prevents shell character clipping
          jq -n \
            --arg model "akai-net" \
            --arg sys "You are an expert Rust engineer. The user's code has an unclosed delimiter syntax error. Fix the file. Return ONLY the raw valid code, without markdown formatting or code blocks." \
            --rawfile user src/main.rs \
            '{model: \$model, stream: false, messages: [{role: "system", content: \(sys}, {role: "user", content: \)user}]}' > payload.json

          echo "Calling your distributed llama.cpp architecture..."
          RESPONSE=\((curl -s -X POST "\)OLLAMA_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ollama" \
            -H "User-Agent: GitHubActions-CI" \
            -d @payload.json)

          echo "Raw Backend Response:"
          echo "\$RESPONSE"

          # Strict multi-schema fallback extractor to capture non-standard JSON formats cleanly
          FIXED_CODE=\((echo "\)RESPONSE" | jq -r '
            if .choices[0].message.content != null then .choices[0].message.content
            elif .choices.message.content != null then .choices.message.content
            elif .response != null then .response
            else empty end
          ')

          if [ -z "\(FIXED_CODE" ] \vert{}\vert{} [ "\)FIXED_CODE" = "null" ]; then
            echo "Error: Could not parse response. See the Raw Backend Response above to debug layout."
            exit 1
          fi

          # Strip away any leftover markdown code wrappers the model returned
          echo "\$FIXED_CODE" | sed -e 's/^```rust//' -e 's/^```//' -e 's/```$//' > src/main.rs
          echo "CI successfully applied the model's patch to src/main.rs!"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH_NAME="ai-patch-${{ github.run_id }}-$RANDOM"
          git checkout -b "$BRANCH_NAME"
          git add src/main.rs
          git commit -m "fix(ci): autonomously resolved compilation delimiter error"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "🤖 AI Patch: Fixed compilation delimiter mismatch" \
            --body "This PR was generated entirely by the GitHub CI loop calling your distributed akai-net cluster to heal a broken main.rs build." \
            --base main \
            --head "$BRANCH_NAME"
