name: Autonomous DevOps Loop

on:
  push:
    branches: [main]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Codebase
        id: compile
        run: cargo build --release 2>&1 | tee compiler_error.log

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: akclip-binary
          path: target/release/akclip

      - name: Package Release Artifacts
        if: success()
        run: |
          chmod +x target/release/akclip
          mkdir -p release
          tar czf release/akclip.tar.gz -C target/release akclip

      - name: Generate SHA256
        id: sha
        if: success()
        run: |
          SHA256=$(sha256sum release/akclip.tar.gz | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Get Latest Tag
        id: tag
        if: success()
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r major minor patch <<< "$VERSION"
          patch=$((patch + 1))
          NEW_TAG="v${major}.${minor}.${patch}"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "previous_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: release/akclip.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Create Homebrew Formula
        if: success()
        run: |
          mkdir -p homebrew-formula
          cat > homebrew-formula/akclip.rb << 'RUBY'
          class Akclip < Formula
            desc "Clipboard utility for capturing stdin"
            homepage "https://github.com/Akinus21/akclip"
            url "https://github.com/Akinus21/akclip/archive/refs/tags/${{ steps.tag.outputs.tag }}.tar.gz"
            sha256 "${{ steps.sha.outputs.sha256 }}"
            license "MIT"
            version "${{ steps.tag.outputs.tag }}"

            def install
              system "tar", "xzf", "akclip.tar.gz"
              bin.install "akclip/target/release/akclip"
            end

            test do
              system "#{bin}/akclip", "--help"
            end
          end
          RUBY

      - name: Update Homebrew Tap
        if: success()
        uses: actions/checkout@v4
        with:
          repository: Akinus21/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Configure Git and Push Homebrew Formula
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd homebrew-tap
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Akinus21/homebrew-tap.git"
          mkdir -p Formula
          cp ../homebrew-formula/akclip.rb Formula/akclip.rb
          git add Formula/akclip.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DEFAULT_BRANCH=$(git remote show origin | grep "HEAD branch" | sed 's/.*: //')
          git commit -m "chore(homebrew): update akclip to ${{ steps.tag.outputs.tag }}" || echo "No changes to commit"
          git push origin $DEFAULT_BRANCH

      - name: Remediate Any Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          echo "Analyzing failure inside active workspace..."

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -d ".git" ]; then
            echo "Initializing missing fallback repository configuration..."
            git init
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO_SLUG}.git"
            git remote set-url --push origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO_SLUG}.git"
            git fetch origin main
            git checkout main
          fi

          mkdir -p .git/info
          echo "compiler_error.log" >> .git/info/exclude
          echo "payload.json" >> .git/info/exclude
          echo "response.txt" >> .git/info/exclude

          git reset --hard HEAD
          git pull origin main --rebase

          LOOP_COUNT=$(git log -n 10 --format="%s" | grep -c "autonomously patched" || true)
          echo "Current autonomous remediation loop depth: $LOOP_COUNT"
          if [ "$LOOP_COUNT" -ge 3 ]; then
            echo "CRITICAL: Maximum iteration depth reached (3 attempts). AI failed to solve error."
            echo "Breaking recursive loop execution to prevent resource exhaustion."
            exit 1
          fi

          COMPILER_LOGS=$(cat compiler_error.log 2>/dev/null || echo "Workflow/Build failed")
          WORKFLOW_FILE=$(cat .github/workflows/cicd-devops-loop.yml 2>/dev/null || echo "")

          export RAW_COMPILER_LOGS="$COMPILER_LOGS"

          node -e '
          const fs = require("fs");
          const logs = process.env.RAW_COMPILER_LOGS;
          const mainRs = fs.readFileSync("src/main.rs", "utf8");
          let workflowContent = "";
          try {
            workflowContent = fs.readFileSync(".github/workflows/cicd-devops-loop.yml", "utf8");
          } catch (e) {}

          const payload = {
            model: "akai-net",
            stream: false,
            messages: [
              {
                role: "system",
                content: "You are an expert Rust engineer and DevOps engineer. The build/release workflow failed. Analyze the error logs and fix the appropriate file(s). Return the raw file content for any file you modify. If it is a Rust error, fix src/main.rs. If it is a workflow/shell/git error, fix .github/workflows/cicd-devops-loop.yml. Return the raw file content WITHOUT markdown blocks or formatting wrappers."
              },
              {
                role: "user",
                content: `[ERROR LOGS]:\n${logs}\n\n[src/main.rs]:\n${mainRs}\n\n[WORKFLOW FILE (.github/workflows/cicd-devops-loop.yml)]:\n${workflowContent}`
              }
            ]
          };
          fs.writeFileSync("payload.json", JSON.stringify(payload));
          '

          echo "Sending payload to AI endpoint for remediation..."
          CurlResponse=$(curl -s -L --post301 --post302 --post303 "https://ollama.akinus21.com/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ollama" \
            -H "User-Agent: GitHubActions-CI" \
            -d @payload.json)

          echo "$CurlResponse" > response.txt

          node -e '
          const fs = require("fs");
          try {
            const rawInput = fs.readFileSync("response.txt", "utf8").trim();
            let combinedContent = "";

            if (rawInput.startsWith("data:")) {
              const lines = rawInput.split("\n");
              for (let line of lines) {
                line = line.trim();
                if (!line || line === "data: [DONE]") continue;
                if (line.startsWith("data:")) {
                  try {
                    const parsedChunk = JSON.parse(line.replace(/^data:\s*/, ""));
                    const delta = parsedChunk.choices[0].delta.content || "";
                    combinedContent += delta;
                  } catch (err) {}
                }
              }
            } else {
              const data = JSON.parse(rawInput);
              combinedContent = data.choices[0].message.content || "";
            }

            if (!combinedContent) {
              console.error("Empty content stream received.");
              process.exit(1);
            }

            let cleaned = combinedContent.trim();
            if (cleaned.startsWith("```")) {
              cleaned = cleaned.replace(/^```[a-zA-Z]*\n?/, "");
              cleaned = cleaned.replace(/```$/, "");
            }

            // Try to detect which file needs fixing based on content patterns
            if (cleaned.includes("name:") && cleaned.includes("on:") && cleaned.includes("jobs:")) {
              // Looks like a workflow file
              fs.writeFileSync(".github/workflows/cicd-devops-loop.yml", cleaned);
              console.log("Workflow file modifications applied!");
            } else if (cleaned.includes("fn main") || cleaned.includes("use std")) {
              // Looks like Rust code
              fs.writeFileSync("src/main.rs", cleaned);
              console.log("Rust file modifications applied!");
            } else {
              // Default to main.rs
              fs.writeFileSync("src/main.rs", cleaned);
              console.log("Defaulting to Rust file modifications applied!");
            }
          } catch (e) {
            console.error("Failed processing response:", e.message);
            process.exit(1);
          }
          '

          echo "CI successfully applied patch!"

          if git diff --quiet; then
            echo "The AI patch matches the existing code. No changes to commit."
            echo "Breaking loop to prevent an infinite cycle."
            exit 0
          else
            echo "Changes detected! Staging and committing..."
            git add -A
            git commit -m "fix(ci): autonomously patched failure"
            git push origin main
          fi
