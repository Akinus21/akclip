name: Autonomous DevOps Loop

on:
  push:
    branches: [main]

jobs:
  devops-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Codebase
        id: compile
        run: cargo build --release 2> compiler_error.log

      - name: Checkout Homebrew Tap Repository
        uses: actions/checkout@v4
        with:
          repository: 'Akinus21/homebrew-tap'
          path: 'homebrew-tap'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remediate Compilation Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Analyzing compiler trace inside active workspace..."
          
          ERROR_LINE=$(grep -oE "src/main.rs:[0-9]+" compiler_error.log | head -n 1 | cut -d':' -f2)
          if [ -z "$ERROR_LINE" ]; then
            ERROR_LINE=66
          fi
          
          START_LINE=$(( ERROR_LINE - 20 ))
          END_LINE=$(( ERROR_LINE + 20 ))
          if [ "$START_LINE" -lt 1 ]; then START_LINE=1; fi

          echo "Extracting context window around line $ERROR_LINE (Lines $START_LINE to $END_LINE)..."
          CONTEXT_SNIPPET=$(sed -n "${START_LINE},${END_LINE}p" src/main.rs)

          export SNIPPET_CONTENT="$CONTEXT_SNIPPET"
          node -e '
          const fs = require("fs");
          const payload = {
            model: "akai-net",
            stream: false,
            messages: [
              {
                role: "system",
                content: "You are an expert Rust engineer. The following code snippet has an unclosed delimiter syntax error. Fix the layout alignment mismatch or missing bracket. Return ONLY the raw valid code snippet to replace this section, without markdown wraps or formatting."
              },
              {
                role: "user",
                content: process.env.SNIPPET_CONTENT
              }
            ]
          };
          fs.writeFileSync("payload.json", JSON.stringify(payload));
          '
          
          echo "Sending snippet payload to verified chat endpoint with redirect forwarding..."
          # FIXED: Added -L, --post301, --post302, --post303 flags to pass payload through ollama-queue 307 redirects safely
          RESPONSE=$(curl -s -L --post301 --post302 --post303 "https://ollama.akinus21.com" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ollama" \
            -H "User-Agent: GitHubActions-CI" \
            -d @payload.json)

          echo "Raw Cluster Response:"
          echo "$RESPONSE"

          FIXED_SNIPPET=$(echo "$RESPONSE" | node -e '
          const fs = require("fs");
          try {
            const data = JSON.parse(fs.readFileSync(0, "utf8"));
            // Handles native Ollama message content, raw response text, or OpenAI format variants
            const content = (data.message && data.message.content) || 
                            data.response || 
                            (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || 
                            "";
            process.stdout.write(content);
          } catch (e) {
            console.error("JSON parsing step failed:", e.message);
            process.exit(1);
          }
          ')

          if [ -z "$FIXED_SNIPPET" ]; then
            echo "Error: Could not parse response choice tokens from cluster layout."
            exit 1
          fi

          echo "$FIXED_SNIPPET" > src/main.rs
          echo "CI successfully applied snippet patch!"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          BRANCH_NAME="ai-patch-${{ github.run_id }}-$RANDOM"
          git checkout -b "$BRANCH_NAME"
          git add src/main.rs
          git commit -m "fix(ci): autonomously patched context window syntax failure"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "🤖 AI Patch: Fixed layout mismatch around line $ERROR_LINE" \
            --body "This PR was generated entirely by your single-job CI pipeline, feeding a 40-line snippet window surrounding your compiler crash line into your akai-net node." \
            --base main \
            --head "$BRANCH_NAME"
