name: Autonomous DevOps Loop

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Codebase
        id: cargo_build
        run: cargo build --release

  remediate-failure:
    needs: build-and-test
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ask akai-net to Self-Heal and Submit PR
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GitHub CI is gathering context from src/main.rs..."
          
          # Native Node script builds a perfect, unescaped JSON file automatically
          node -e '
          const fs = require("fs");
          const brokenCode = fs.readFileSync("src/main.rs", "utf8");
          
          const payload = {
            model: "akai-net",
            stream: false,
            messages: [
              {
                role: "system",
                content: "You are an expert Rust engineer. The user\x27s code has an unclosed delimiter syntax error. Fix the file. Return ONLY the raw valid code, without markdown formatting or code blocks."
              },
              {
                role: "user",
                content: brokenCode
              }
            ]
          };
          
          fs.writeFileSync("payload.json", JSON.stringify(payload));
          '

          echo "Calling your distributed llama.cpp architecture..."
          RESPONSE=\$(curl -s -X POST "https://ollama.akinus21.com" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ollama" \
            -H "User-Agent: GitHubActions-CI" \
            -d @payload.json)

          echo "Raw Backend Response:"
          echo "\$RESPONSE"

          # Extract raw response text using inline Node to bypass jq bugs entirely
          FIXED_CODE=\((echo "\)RESPONSE" | node -e '
          const fs = require("fs");
          const raw = fs.readFileSync(0, "utf8");
          try {
            const data = JSON.parse(raw);
            const content = data.choices?.[0]?.message?.content || data.choices?.message?.content || data.response || "";
            process.stdout.write(content);
          } catch(e) {
            process.exit(1);
          }
          ')

          if [ -z "\$FIXED_CODE" ]; then
            echo "Error: Could not parse response text from backend cluster."
            exit 1
          fi

          # Strip away any leftover markdown code wrappers the model returned
          echo "\$FIXED_CODE" | sed -e 's/^```rust//' -e 's/^```//' -e 's/```$//' > src/main.rs
          echo "CI successfully applied the model's patch to src/main.rs!"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          BRANCH_NAME="ai-patch-${{ github.run_id }}-$RANDOM"
          git checkout -b "$BRANCH_NAME"
          git add src/main.rs
          git commit -m "fix(ci): autonomously resolved compilation delimiter error"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "🤖 AI Patch: Fixed compilation delimiter mismatch" \
            --body "This PR was generated entirely by the GitHub CI loop calling your distributed akai-net cluster to heal a broken main.rs build." \
            --base main \
            --head "$BRANCH_NAME"
