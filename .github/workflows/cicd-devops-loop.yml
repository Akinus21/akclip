name: DevOps Loop

on:
  push:
    branches: [devops]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  devops-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Skip Merge Commits
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          if [[ "$COMMIT_MSG" == Merge\ pull\ request* ]]; then
            echo "Skipping merge commit..."
            echo "SKIP_BUILD=true" >> $GITHUB_OUTPUT
          else
            echo "SKIP_BUILD=false" >> $GITHUB_OUTPUT
          fi

      - name: Compile Codebase
        if: env.SKIP_BUILD != 'true'
        id: compile
        run: cargo build --release 2>&1 | tee compiler_error.log
        id: compile
        run: cargo build --release 2>&1 | tee compiler_error.log

      - name: Upload Build Artifact
        if: success() && env.SKIP_BUILD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: akclip-binary
          path: target/release/akclip

      - name: Create PR on Success
        if: success() && env.SKIP_BUILD != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Build succeeded! Creating PR to main..."
          BRANCH_NAME=$(git branch --show-current)

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head $BRANCH_NAME --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for branch $BRANCH_NAME"
          else
            gh pr create \
              --base main \
              --head $BRANCH_NAME \
              --title "DevOps: update from ${BRANCH_NAME}" \
              --body "DevOps loop completed successfully. Build verified. Ready to merge."
          fi

      - name: Remediate Any Failure
        if: failure() && env.SKIP_BUILD != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          echo "Analyzing failure inside active workspace..."

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME=$(git branch --show-current)
          echo "Working on branch: $BRANCH_NAME"

          mkdir -p .git/info
          echo "compiler_error.log" >> .git/info/exclude
          echo "payload.json" >> .git/info/exclude
          echo "response.txt" >> .git/info/exclude

          git reset --hard HEAD
          git pull origin $BRANCH_NAME --rebase || true

          LOOP_COUNT=$(git log -n 100 --format="%s" | grep -c "autonomously patched" || true)
          echo "Current autonomous remediation loop depth: $LOOP_COUNT"
          if [ "$LOOP_COUNT" -ge 10 ]; then
            echo "CRITICAL: Maximum iteration depth reached (10 attempts). AI failed to solve error."
            LAST_COMMIT=$(git log -1 --pretty=format:'%H - %s')
            ISSUE_BODY=$(printf '%s\n%s\n\n%s\n%s\n' \
              "The DevOps agent attempted 10 iterations to fix the build but was unsuccessful. Manual intervention required." \
              "Last commit with issue:" \
              "${LAST_COMMIT}" \
              "Please review and provide guidance.")
            gh issue create \
              --title "DevOps Failed: Unable to fix build after 10 iterations" \
              --body "${ISSUE_BODY}"
            exit 1
          fi

          COMPILER_LOGS=$(cat compiler_error.log 2>/dev/null || echo "Build/Workflow failed")
          WORKFLOW_FILE=$(cat .github/workflows/cicd-devops-loop.yml 2>/dev/null || echo "")

          export RAW_COMPILER_LOGS="$COMPILER_LOGS"

          cat > fix.js << 'ENDSCRIPT'
          const fs = require("fs");
          const logs = process.env.RAW_COMPILER_LOGS;
          const mainRs = fs.readFileSync("src/main.rs", "utf8");
          let workflowContent = "";
          try {
            workflowContent = fs.readFileSync(".github/workflows/cicd-devops-loop.yml", "utf8");
          } catch (e) {}

          const payload = {
            model: "akai-net",
            stream: false,
            messages: [
              {
                role: "system",
                content: "You are an expert Rust engineer and DevOps engineer. The build/release workflow failed. Analyze the error logs and fix the appropriate file(s). Return the raw file content for any file you modify WITHOUT markdown blocks or formatting wrappers. If it is a Rust error, fix src/main.rs. If it is a workflow/shell/git error, fix .github/workflows/cicd-devops-loop.yml."
              },
              {
                role: "user",
                content: "[ERROR LOGS]:\n" + logs + "\n\n[src/main.rs]:\n" + mainRs + "\n\n[WORKFLOW FILE (.github/workflows/cicd-devops-loop.yml)]:\n" + workflowContent
              }
            ]
          };
          fs.writeFileSync("payload.json", JSON.stringify(payload));
          ENDSCRIPT

          node fix.js

          echo "Sending payload to AI endpoint for remediation..."
          CurlResponse=$(curl -s -L --post301 --post302 --post303 "https://ollama.akinus21.com/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ollama" \
            -H "User-Agent: GitHubActions-CI" \
            -d @payload.json)

          echo "$CurlResponse" > response.txt

          cat > parse.js << 'ENDPARSE'
          const fs = require("fs");
          try {
            const rawInput = fs.readFileSync("response.txt", "utf8").trim();
            let combinedContent = "";

            if (rawInput.startsWith("data:")) {
              const lines = rawInput.split("\n");
              for (let line of lines) {
                line = line.trim();
                if (!line || line === "data: [DONE]") continue;
                if (line.startsWith("data:")) {
                  try {
                    const parsedChunk = JSON.parse(line.replace(/^data:\s*/, ""));
                    const delta = parsedChunk.choices[0].delta.content || "";
                    combinedContent += delta;
                  } catch (err) {}
                }
              }
            } else {
              const data = JSON.parse(rawInput);
              combinedContent = data.choices[0].message.content || "";
            }

            if (!combinedContent) {
              console.error("Empty content stream received.");
              process.exit(1);
            }

            let cleaned = combinedContent.trim();
            if (cleaned.startsWith("```")) {
              cleaned = cleaned.replace(/^```[a-zA-Z]*\n?/, "");
              cleaned = cleaned.replace(/```$/, "");
            }

            if (cleaned.includes("name:") && cleaned.includes("on:") && cleaned.includes("jobs:")) {
              fs.writeFileSync(".github/workflows/cicd-devops-loop.yml", cleaned);
              console.log("Workflow file updated!");
            } else if (cleaned.includes("fn main") || cleaned.includes("use std")) {
              fs.writeFileSync("src/main.rs", cleaned);
              console.log("Rust source file updated!");
            } else {
              fs.writeFileSync("src/main.rs", cleaned);
              console.log("Defaulting to Rust source!");
            }
          } catch (e) {
            console.error("Failed processing response:", e.message);
            process.exit(1);
          }
          ENDPARSE

          node parse.js

          echo "CI successfully applied patch!"

          if git diff --quiet; then
            echo "The AI patch matches the existing code. No changes to commit."
            echo "Breaking loop to prevent an infinite cycle."
            exit 0
          else
            echo "Changes detected! Staging and committing..."
            git add -A
            git commit -m "fix(ci): autonomously patched failure"
            git push origin $BRANCH_NAME
          fi

      - name: Respond to PR Comment
        if: github.event_name == 'pull_request_review_comment'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          BRANCH_NAME=$(git branch --show-current)

          echo "Responding to PR comment on #$PR_NUM..."

          # Post response as PR comment
          gh pr comment $PR_NUM --body "Agent acknowledged your request on DevOps branch '${BRANCH_NAME}'. Work is being processed."
