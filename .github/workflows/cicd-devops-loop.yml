name: Autonomous DevOps Loop

on:
  push:
    branches: [main]

jobs:
  # Job 1: Compile and check your Rust codebase
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Codebase
        id: compile
        run: cargo build --release

  # Job 2: Wakes up your model ONLY if the compilation above crashes
  remediate-failure:
    needs: build-and-test
    if: failure() # <--- Crucial line: forces the runner to execute even when cargo crashes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Self-Healing Loop via Custom Backend
        run: |
          echo "Build failed. Waking up akai-net model on ://ollama.akinus21.com to resolve compilation error..."
          
          # This routes the error context directly to your distributed cluster 
          curl -s -X POST "https://://ollama.akinus21.com/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ollama" \
            -d '{
              "model": "akai-net",
              "messages": [
                {
                  "role": "system", 
                  "content": "You are an autonomous SRE. The Rust compilation failed with an unclosed delimiter on src/main.rs. Modify the file, correct the syntax formatting, verify it passes locally via cargo check, and open a PR."
                }
              ]
            }'
