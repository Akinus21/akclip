name: Autonomous DevOps Loop

on:
  push:
    branches: [main]

jobs:
  devops-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # STEP 1: Compile and capture errors into a local file in the same workspace
      - name: Compile Codebase
        id: compile
        run: cargo build --release 2> compiler_error.log

      # STEP 2: Extract window context, call your cluster, and open the PR on failure
      - name: Remediate Compilation Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Analyzing compiler trace inside active workspace..."
          
          # Extract line number out of cargo error logs (e.g., src/main.rs:66:3)
          ERROR_LINE=$(grep -oE "src/main.rs:[0-9]+" compiler_error.log | head -n 1 | cut -d':' -f2)
          
          if [ -z "$ERROR_LINE" ]; then
            echo "Could not find explicit line number in error log. Defaulting to line 30."
            ERROR_LINE=30
          fi
          
          # Compute the sliding 40-line snippet window bounds
          START_LINE=$(( ERROR_LINE - 20 ))
          END_LINE=$(( ERROR_LINE + 20 ))
          if [ "$START_LINE" -lt 1 ]; then START_LINE=1; fi

          echo "Extracting context window around line $ERROR_LINE (Lines $START_LINE to $END_LINE)..."
          CONTEXT_SNIPPET=$(sed -n "${START_LINE},${END_LINE}p" src/main.rs)

          # Build payload using an inline Node process with mapped env context inputs
          # This avoids backslash escaping and tokenization bugs entirely
          export SNIPPET_CONTENT="$CONTEXT_SNIPPET"
          node -e '
          const fs = require("fs");
          const payload = {
            model: "akai-net",
            stream: false,
            messages: [
              {
                role: "system",
                content: "You are an expert Rust engineer. The user has a compilation error on or near the middle of this code snippet. Correct the layout alignment mismatch or unclosed delimiter syntax error. Return ONLY the raw valid code snippet to replace this section, without markdown wraps or formatting."
              },
              {
                role: "user",
                content: process.env.SNIPPET_CONTENT
              }
            ]
          };
          fs.writeFileSync("payload.json", JSON.stringify(payload));
          '
          
          echo "Sending snippet payload over to your distributed architecture..."
          RESPONSE=$(curl -s -X POST "https://ollama.akinus21.com" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ollama" \
            -H "User-Agent: GitHubActions-CI" \
            -d @payload.json)

          echo "Raw Cluster Response:"
          echo "$RESPONSE"

          # Extract model choice text response safely
          FIXED_SNIPPET=$(echo "$RESPONSE" | node -e '
          const fs = require("fs");
          try {
            const data = JSON.parse(fs.readFileSync(0, "utf8"));
            const content = data.choices?.[0]?.message?.content || data.choices?.message?.content || data.response || "";
            process.stdout.write(content);
          } catch (e) {
            process.exit(1);
          }
          ')

          if [ -z "$FIXED_SNIPPET" ]; then
            echo "Error: Could not parse choice content payload from cluster response."
            exit 1
          fi

          # Apply snippet correction back to src/main.rs
          echo "$FIXED_SNIPPET" > src/main.rs
          echo "CI successfully applied snippet patch!"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          BRANCH_NAME="ai-patch-${{ github.run_id }}-$RANDOM"
          git checkout -b "$BRANCH_NAME"
          git add src/main.rs
          git commit -m "fix(ci): autonomously patched context window syntax failure"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "🤖 AI Patch: Fixed layout mismatch around line $ERROR_LINE" \
            --body "This PR was generated entirely by your single-job CI pipeline, feeding a 40-line snippet window surrounding your compiler crash line into your akai-net node." \
            --base main \
            --head "$BRANCH_NAME"
