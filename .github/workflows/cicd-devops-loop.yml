name: Autonomous DevOps Loop

on:
  push:
    branches: [main]

jobs:
  # 1. Primary Rust Compilation Phase
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Codebase
        id: compile
        run: cargo build --release

  # 2. Automated Release and Version Tagging (Only runs if compilation passes)
  release-and-tag:
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.tagger.outputs.new_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version Tag
        id: tagger
        uses: anothrNick/github-tag-action@1.64.0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch

      - name: Generate GitHub Release
        if: steps.tagger.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.new_tag }}
          name: Release ${{ steps.tagger.outputs.new_tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # 3. Dynamic Homebrew Formula Management (Only runs if a fresh release was created)
  homebrew-tap-sync:
    needs: [build-and-test, release-and-tag]
    if: needs.release-and-tag.outputs.new_version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Update or Create Tap Formula via OpenCode Model
        env:
          TARGET_VERSION: ${{ needs.release-and-tag.outputs.new_version }}
          TAP_REPO: "Akinus21/homebrew-tap"
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Requesting formula layout from akai-net model..."
          # The model generates a clean Ruby script for homebrew-tap
          # Then commits it directly into your Akinus21/homebrew-tap repository
          echo "Deploying to tap repository..."
