name: Autonomous DevOps Loop

on:
  push:
    branches: [main]

jobs:
  # STEP 1: Compile your Rust application
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Codebase
        id: cargo_build
        run: cargo build --release

  # STEP 2: Let GitHub CI capture the crash, call your cluster, and fix it automatically
  remediate-failure:
    needs: build-and-test
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ask akai-net to Self-Heal and Submit PR
        env:
          # Standard curl flags use a split variable to easily bypass proxy quirks
          OLLAMA_URL: "https://ollama.akinus21.com"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GitHub CI is gathering context from src/main.rs..."
          
          # 1. Read the broken code file cleanly into an environment variable
          BROKEN_CODE=$(cat src/main.rs)
          
          # 2. Format a straightforward, clean JSON file without nested shell quoting bugs
          jq -n \
            --arg model "akai-net" \
            --arg sys "You are an expert Rust engineer. The user's code has an unclosed delimiter syntax error. Fix the file. Return ONLY the raw valid code, without markdown formatting or code blocks." \
            --arg user "$BROKEN_CODE" \
            '{model: $model, stream: false, messages: [{role: "system", content: $sys}, {role: "user", content: $user}]}' > payload.json

          echo "Calling your distributed llama.cpp architecture..."
          # 3. Fire the request directly to your cluster using standard bearer auth
          RESPONSE=$(curl -s -X POST "$OLLAMA_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ollama" \
            -H "User-Agent: GitHubActions-CI" \
            -d @payload.json)

          # 4. Extract the clean code fix out of the standard OpenAI JSON response layout
          FIXED_CODE=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

          # 5. Overwrite the broken file
          echo "$FIXED_CODE" > src/main.rs
          echo "CI successfully applied the model's patch to src/main.rs!"

          # 6. Have the native GitHub CI Bot handle git pushing and opening the PR entirely
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          BRANCH_NAME="ai-remediation-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"
          git add src/main.rs
          git commit -m "fix(ci): autonomously resolved compilation delimiter error"
          git push origin "$BRANCH_NAME"

          # Use GitHub's official CLI tool to open the PR automatically
          gh pr create \
            --title "🤖 AI Patch: Fixed compilation delimiter mismatch" \
            --body "This PR was generated entirely by the GitHub CI loop calling your distributed akai-net cluster to heal a broken main.rs build." \
            --base main \
            --head "$BRANCH_NAME"
