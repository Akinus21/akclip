name: Autonomous DevOps Loop

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Codebase
        run: cargo build --release

  remediate-failure:
    needs: build-and-test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Self-Healing Loop via Custom Backend
        run: |
          echo "Waking up akai-net model on ://ollama.akinus21.com..."
          
          cat << 'JSON' > payload.json
          {
            "model": "akai-net",
            "messages": [
              {
                "role": "system", 
                "content": "You are an autonomous SRE. The Rust compilation failed with an unclosed delimiter on src/main.rs. Modify the file, correct the syntax formatting, verify it passes locally via cargo check, and open a PR."
              }
            ]
          }
          JSON

          curl -s -X POST "https://https://ollama.akinus21.com/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ollama" \
            -d @payload.json
