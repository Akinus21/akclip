name: Autonomous DevOps Loop

on:
  push:
    branches: [main]

jobs:
  devops-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push directly to main
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Codebase
        id: compile
        run: cargo build --release 2> compiler_error.log

      - name: Remediate Compilation Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Analyzing compiler trace inside active workspace..."
          
          ERROR_LINE=$(grep -oE "src/main.rs:[0-9]+" compiler_error.log | head -n 1 | cut -d':' -f2)
          if [ -z "$ERROR_LINE" ]; then
            ERROR_LINE=66
          fi
          
          START_LINE=$(( ERROR_LINE - 20 ))
          END_LINE=$(( ERROR_LINE + 20 ))
          if [ "$START_LINE" -lt 1 ]; then START_LINE=1; fi

          echo "Extracting context window around line $ERROR_LINE (Lines $START_LINE to $END_LINE)..."
          CONTEXT_SNIPPET=$(sed -n "${START_LINE},${END_LINE}p" src/main.rs)

          export SNIPPET_CONTENT="$CONTEXT_SNIPPET"
          node -e '
          const fs = require("fs");
          const payload = {
            model: "akai-net",
            stream: false,
            messages: [
              {
                role: "system",
                content: "You are an expert Rust engineer. The following code snippet has an unclosed delimiter syntax error. Fix the layout alignment mismatch or missing bracket. Return ONLY the raw valid code snippet to replace this section, without markdown wraps or formatting."
              },
              {
                role: "user",
                content: process.env.SNIPPET_CONTENT
              }
            ]
          };
          fs.writeFileSync("payload.json", JSON.stringify(payload));
          '
          
          echo "Sending snippet payload to verified chat endpoint with redirect forwarding..."
          RESPONSE=$(curl -s -L --post301 --post302 --post303 "https://ollama.akinus21.com/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ollama" \
            -H "User-Agent: GitHubActions-CI" \
            -d @payload.json)

          FIXED_SNIPPET=$(echo "$RESPONSE" | node -e '
          const fs = require("fs");
          try {
            const rawInput = fs.readFileSync(0, "utf8");
            let combinedContent = "";

            if (rawInput.trim().startsWith("data:")) {
              const lines = rawInput.split("\n");
              for (let line of lines) {
                line = line.trim();
                if (!line || line === "data: [DONE]") continue;
                if (line.startsWith("data:")) {
                  try {
                    const parsedChunk = JSON.parse(line.replace(/^data:\s*/, ""));
                    const delta = parsedChunk.choices[0].delta.content || "";
                    combinedContent += delta;
                  } catch (err) {}
                }
              }
            } else {
              const data = JSON.parse(rawInput);
              combinedContent = data.choices[0].message.content || "";
            }

            if (!combinedContent) {
              console.error("Empty content stream received.");
              process.exit(1);
            }

            process.stdout.write(combinedContent);
          } catch (e) {
            console.error("Failed parsing tokens:", e.message);
            process.exit(1);
          }
          ')

          if [ -z "$FIXED_SNIPPET" ]; then
            echo "Error: Could not parse response tokens."
            exit 1
          fi

          echo "$FIXED_SNIPPET" > src/main.rs
          echo "CI successfully applied snippet patch!"

          # Configure Git Credentials
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # Pull latest upstream to prevent conflict loops before forcing changes
          git pull origin main --rebase

          # Track, commit, and push directly to main
          git add src/main.rs
          git commit -m "fix(ci): autonomously patched context window syntax failure [skip ci]"
          git push origin main

      - name: Manage Homebrew Release Tap
        if: success()
        uses: actions/checkout@v4
        with:
          repository: 'Akinus21/homebrew-tap'
          path: 'homebrew-tap'
          token: ${{ secrets.GITHUB_TOKEN }}
