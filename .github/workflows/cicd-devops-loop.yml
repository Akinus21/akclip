name: DevOps Loop

on:
  push:
    branches: [devops]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  devops-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Skip Merge Commits
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          if [[ "$COMMIT_MSG" == Merge\ pull\ request* ]]; then
            echo "Skipping merge commit..."
            echo "SKIP_BUILD=true" >> $GITHUB_OUTPUT
          else
            echo "SKIP_BUILD=false" >> $GITHUB_OUTPUT
          fi

      - name: Compile Codebase
        if: env.SKIP_BUILD != 'true'
        id: compile
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee compiler_error.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "BUILD_EXIT=$BUILD_EXIT"
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "Build failed with exit code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi

      - name: Upload Build Artifact
        if: success() && env.SKIP_BUILD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: akclip-binary
          path: target/release/akclip

      - name: Create PR on Success
        if: success() && env.SKIP_BUILD != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Build succeeded! Creating PR to main..."
          BRANCH_NAME=$(git branch --show-current)

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head $BRANCH_NAME --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for branch $BRANCH_NAME"
          else
            gh pr create \
              --base main \
              --head $BRANCH_NAME \
              --title "DevOps: update from ${BRANCH_NAME}" \
              --body "DevOps loop completed successfully. Build verified. Ready to merge."
          fi

      - name: Remediate Any Failure
        if: failure() && env.SKIP_BUILD != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          echo "Analyzing failure inside active workspace..."

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME=$(git branch --show-current)
          echo "Working on branch: $BRANCH_NAME"

          mkdir -p .git/info
          echo "compiler_error.log" >> .git/info/exclude

          git reset --hard HEAD
          git pull origin $BRANCH_NAME --rebase || true

          COMPILER_LOGS=$(cat compiler_error.log 2>/dev/null || echo "Build/Workflow failed")
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          REF="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          WEBHOOK_URL="https://webhook.akinus21.com/webhook/akclip-build"

          printf -v MESSAGE 'The %s build in the %s branch failed with the following errors:\n\n%s\n' \
            "$REPO" "$REF" "$COMPILER_LOGS"

          jq -n \
            --arg event "build_failure" \
            --arg repo "$REPO" \
            --arg run_url "$RUN_URL" \
            --arg sha "$SHA" \
            --arg ref "$REF" \
            --arg error "$COMPILER_LOGS" \
            --arg message "$MESSAGE" \
            '{event:$event,repo:$repo,run_url:$run_url,sha:$sha,ref:$ref,error:$error,message:$message}' > /tmp/payload.json

          SIG=$(openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_HMAC_SECRET }}" /tmp/payload.json | awk '{print "sha256="$2}')

          RETRY_COUNT=0
          SUCCESS=false

          while [ "$SUCCESS" = "false" ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Sending webhook to OpenCode (attempt $RETRY_COUNT)..."

            if curl -fsSL -X POST \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Event: build_failure" \
              -H "X-Hub-Signature-256: $SIG" \
              --data-binary @/tmp/payload.json \
              "$WEBHOOK_URL"; then
              SUCCESS=true
              echo "Webhook sent successfully, OpenCode will push fixes to $BRANCH_NAME"
            else
              echo "Webhook attempt $RETRY_COUNT failed, retrying in 5 seconds..."
              sleep 5
            fi
          done

      - name: Respond to PR Comment
        if: github.event_name == 'pull_request_review_comment'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          BRANCH_NAME=$(git branch --show-current)

          echo "Responding to PR comment on #$PR_NUM..."

          # Post response as PR comment
          gh pr comment $PR_NUM --body "Agent acknowledged your request on DevOps branch '${BRANCH_NAME}'. Work is being processed."
