name: Release Sync

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: |
          cargo build --release
          mkdir -p release
          chmod +x target/release/akclip
          # Create tarball with proper structure: akclip/target/release/akclip
          mkdir -p akclip/target/release
          cp target/release/akclip akclip/target/release/
          tar czf release/akclip.tar.gz akclip
          rm -rf akclip

      - name: Get Latest Tag
        id: tag
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r major minor patch <<< "$VERSION"

          # Find next available tag
          found=0
          while [ $found -eq 0 ]; do
            patch=$((patch + 1))
            NEW_TAG="v${major}.${minor}.${patch}"
            if ! git tag | grep -q "^${NEW_TAG}$"; then
              found=1
            fi
          done

          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "previous_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Create Git Tag and Release
        run: |
          git tag ${{ steps.tag.outputs.tag }}
          git push origin ${{ steps.tag.outputs.tag }}

          # Wait a moment for tag to propagate
          sleep 2

          # Create release and upload asset
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/Akinus21/akclip/releases" \
            -d '{
              "tag_name": "'${{ steps.tag.outputs.tag }}'",
              "name": "Release '${{ steps.tag.outputs.tag }}'",
              "draft": true
            }')

          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT

          # Upload asset
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/Akinus21/akclip/releases/${RELEASE_ID}/assets?name=akclip.tar.gz" \
            --data-binary @release/akclip.tar.gz > /dev/null

          # Make release public
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/Akinus21/akclip/releases/${RELEASE_ID}" \
            -d '{"draft":false}'

      - name: Get SHA256 from GitHub Release Asset
        id: sha
        run: |
          # Get the download URL for the asset
          ASSET_INFO=$(curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            "https://api.github.com/repos/Akinus21/akclip/releases/tags/${{ steps.tag.outputs.tag }}")

          ASSET_URL=$(echo "$ASSET_INFO" | jq -r '.assets[] | select(.name == "akclip.tar.gz") | .browser_download_url')
          echo "asset_url=$ASSET_URL" >> $GITHUB_OUTPUT

          # Download and get SHA256
          curl -sL "$ASSET_URL" -o downloaded.tar.gz
          SHA256=$(sha256sum downloaded.tar.gz | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Create Homebrew Formula
        env:
          SHA256: ${{ steps.sha.outputs.sha256 }}
          TAG: ${{ steps.tag.outputs.tag }}
          ASSET_URL: ${{ steps.sha.outputs.asset_url }}
        run: |
          mkdir -p homebrew-formula
          cat > homebrew-formula/akclip.rb << 'RUBY'
          class Akclip < Formula
            desc "Clipboard utility for capturing stdin"
            homepage "https://github.com/Akinus21/akclip"
            url "ASSET_URL_PLACEHOLDER"
            sha256 "SHA256_PLACEHOLDER"
            license "MIT"
            version "VERSION_PLACEHOLDER"

            def install
              tar xzf "akclip.tar.gz"
              bin.install "akclip/target/release/akclip"
            end

            test do
              system "#{bin}/akclip", "--help"
            end
          end
          RUBY

          sed -i "s|ASSET_URL_PLACEHOLDER|${ASSET_URL}|g" homebrew-formula/akclip.rb
          sed -i "s|SHA256_PLACEHOLDER|${SHA256}|g" homebrew-formula/akclip.rb
          sed -i "s|VERSION_PLACEHOLDER|${TAG}|g" homebrew-formula/akclip.rb

      - name: Update Homebrew Tap
        uses: actions/checkout@v4
        with:
          repository: Akinus21/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Configure Git and Push Homebrew Formula
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd homebrew-tap
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/Akinus21/homebrew-tap.git"
          mkdir -p Formula
          cp ../homebrew-formula/akclip.rb Formula/akclip.rb
          git add Formula/akclip.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DEFAULT_BRANCH=$(git remote show origin | grep "HEAD branch" | sed 's/.*: //')
          git commit -m "chore(homebrew): update akclip to ${{ steps.tag.outputs.tag }}" || echo "No changes to commit"
          git push origin $DEFAULT_BRANCH
