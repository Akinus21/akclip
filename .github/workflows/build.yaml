name: Build and Test

on:
  push:
    branches: [main]

jobs:
  # 1. Compile and test the Rust codebase
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Tests
        run: cargo test

  # 2. Automated Release and Version Tagging
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tagger.outputs.new_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version and Create Tag
        id: tagger
        uses: anothrNick/github-tag-action@1.64.0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch

      - name: Create GitHub Release
        if: steps.tagger.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.new_tag }}
          name: Release ${{ steps.tagger.outputs.new_tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  # 3. Hand over tap management to the Agent
  deploy-tap:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Invoke Agent Tap Manager
        uses: github/gh-aw@main
        env:
          OPENAI_API_BASE: "https://akinus21.com"
          OPENAI_API_KEY: "ollama"
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # Provided to allow agent to git push to homebrew-tap
        with:
          agent-definition: '.github/agents/devops-sre.md'
          # Pass context variables so the agent knows exactly what version tag just dropped
          instructions: "The software build succeeded. Run your formula check and update/create the formula for version ${{ needs.release.outputs.version }} inside the Akinus21/homebrew-tap repository."
